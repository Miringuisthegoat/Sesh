{% extends "base.html" %}
{% from "_macros.html" import field %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="narrow mx-auto card shadow-sm"><div class="card-body p-4">
  <h1 class="h4 mb-3">Sign in</h1>
  <form method="post" novalidate>
    {{ form.hidden_tag() }}
    {{ field(form.email) }}
    {{ field(form.password) }}
    <button class="btn btn-primary w-100">Sign in</button>
  </form>
</div></div>
{% endblock %}
