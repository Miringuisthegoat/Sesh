{% extends "base.html" %}
{% from "_macros.html" import field %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="narrow mx-auto card shadow-sm"><div class="card-body p-4">
  <h1 class="h5">Reset password for {{ user.full_name }}</h1>
  <form method="post" novalidate>
    {{ form.hidden_tag() }}
    {{ field(form.password, "At least 10 characters.") }}
    <button class="btn btn-primary">Save new password</button>
    <a class="btn btn-link" href="{{ url_for('admin.workers') }}">Cancel</a>
  </form>
</div></div>
{% endblock %}
