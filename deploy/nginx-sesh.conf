# /etc/nginx/sites-available/sesh  -> symlink into sites-enabled. Replace sesh.example.com.
# Put these two lines in the http {} block (nginx.conf) once:
#   limit_req_zone $binary_remote_addr zone=sesh_web:10m rate=10r/s;
#   limit_req_zone $binary_remote_addr zone=sesh_agent:10m rate=5r/s;
server {
    listen 80;
    server_name sesh.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name sesh.example.com;
    ssl_certificate     /etc/letsencrypt/live/sesh.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sesh.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    client_max_body_size 26m;          # MAX_UPLOAD_MB (25) plus multipart overhead; keep in step
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location /api/agent/ {
        limit_req zone=sesh_agent burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params_sesh;
    }
    location / {
        limit_req zone=sesh_web burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params_sesh;
    }
}
